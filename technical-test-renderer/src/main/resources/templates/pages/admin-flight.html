<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Administration - Création de Vol</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f7fc; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px #ccc; }
        h2 { color: #3498db; }
        label { display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; background: #3498db; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .success { color: green; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Créer un nouveau vol</h2>
    <form th:action="@{/admin/flight}" th:object="${flight}" method="post">
        <label>Départ (IATA): <input type="text" th:field="*{origin.iata}" required /></label>
        <label>Arrivée (IATA): <input type="text" th:field="*{destination.iata}" required /></label>
        <label>Date départ: <input type="datetime-local" th:field="*{departure}" required /></label>
        <label>Date arrivée: <input type="datetime-local" th:field="*{arrival}" required /></label>
        <label>Prix (€): <input type="number" step="0.01" th:field="*{price}" required /></label>
        <label>Image (URL): <input type="text" th:field="*{image}" /></label>
        <button type="submit">Créer le vol</button>
    </form>
    <div th:if="${success}" class="success">Vol créé avec succès !</div>
</div>
</body>
</html>
